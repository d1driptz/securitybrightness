name: Website preview browser smoke tests

on:
  push:
    branches: [website-redesign-preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Test preview and scanner in Chromium
        env:
          WEBSITE_CAPTURE_SCREENSHOTS: '1'
        run: python tools/website_smoke.py
      - name: Upload browser screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-preview-screenshots
          path: website-review-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
