name: Website release PR smoke tests
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scanner.html'
      - 'tools/website_release_smoke.py'
      - '.github/workflows/website-release-pr-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: python tools/website_release_smoke.py
